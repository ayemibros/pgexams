<div class="theme-picker">
  <button type="button" class="theme-btn" aria-haspopup="true" aria-expanded="false" aria-label="Change theme" title="Theme">{{ icon("palette", size=18) }}</button>
  <div class="theme-menu" role="menu">
    <div class="theme-menu-title">Theme</div>
    <button type="button" class="theme-opt" role="menuitemradio" data-set-theme="dark" aria-checked="false"><span class="theme-swatch" style="background:linear-gradient(135deg,#101725 50%,#2f6bea 50%)"></span>Dark<span class="theme-check">{{ icon("check", size=16) }}</span></button>
    <button type="button" class="theme-opt" role="menuitemradio" data-set-theme="light" aria-checked="false"><span class="theme-swatch" style="background:linear-gradient(135deg,#ffffff 50%,#2563eb 50%)"></span>Light<span class="theme-check">{{ icon("check", size=16) }}</span></button>
    <button type="button" class="theme-opt" role="menuitemradio" data-set-theme="sepia" aria-checked="false"><span class="theme-swatch" style="background:linear-gradient(135deg,#fbf6ea 50%,#a85d17 50%)"></span>Sepia (easy reading)<span class="theme-check">{{ icon("check", size=16) }}</span></button>
    <button type="button" class="theme-opt" role="menuitemradio" data-set-theme="ocean" aria-checked="false"><span class="theme-swatch" style="background:linear-gradient(135deg,#0a2129 50%,#14b8a6 50%)"></span>Ocean<span class="theme-check">{{ icon("check", size=16) }}</span></button>
  </div>
</div>
