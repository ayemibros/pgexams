<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Site administration{% endblock %} · CBT System admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<style>
*{box-sizing:border-box}
body{font-size:14px}
a{color:var(--primary-text);text-decoration:none}
a:hover{text-decoration:underline}
header{background:rgba(8,12,20,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);color:#fff;padding:.85rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
header .brand{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;font-size:1rem;color:#fff}
header .who{font-size:.8rem;color:var(--text-2)}
header .who a{color:var(--amber)}
header form{display:inline}
header button{background:none;border:none;color:var(--amber);cursor:pointer;font:inherit;padding:0}
.crumbs{background:var(--card);border-bottom:1px solid var(--border);color:var(--muted-2);padding:.5rem 1.5rem;font-size:.8rem}
.crumbs a{color:var(--text-2)}
main{max-width:1200px;margin:0 auto;padding:1.5rem}
h1{font-size:1.3rem;margin:0 0 1rem}
.card{overflow:hidden;margin-bottom:1.25rem}
.card h2{margin:0;padding:.75rem 1rem;background:linear-gradient(90deg,rgba(47,107,234,.22),rgba(47,107,234,.05));border-bottom:1px solid var(--border);color:#fff;font-size:.74rem;font-weight:500;text-transform:uppercase;letter-spacing:.12em}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.55rem .8rem;background:rgba(148,163,184,.05);font-weight:500;font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
td{padding:.55rem .8rem;border-top:1px solid var(--border);vertical-align:top}
.btn{padding:.45rem .9rem;border-color:var(--border-strong);background:var(--card);color:var(--text);font-size:.8rem}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-danger{background:var(--danger-solid);border-color:var(--danger-solid);color:#fff}
.msg{padding:.65rem 1rem;border-radius:10px;margin-bottom:1rem;font-weight:500;font-size:.85rem}
.msg-success{background:rgba(16,185,129,.1);color:var(--success)}
.msg-error{background:rgba(225,29,72,.08);color:var(--danger)}
.msg-info,.msg-warning{background:rgba(245,158,11,.1);color:var(--warning)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],input[type=date],select,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--border-strong);border-radius:9px;font:inherit;background-color:var(--surface);color:var(--text)}
textarea{min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.muted{color:var(--muted-2);font-size:.78rem}
</style>
</head>
<body>
<header>
  <a class="brand" href="/admin/">{{ icon("settings", css_class="ico") }} CBT System administration</a>
  <div class="who">Welcome, <strong>{{ request.user.username }}</strong>. <a href="/">View site</a> / <a href="{{ url('accounts:change_password') }}">Change password</a> /
    <form method="post" action="{{ url('accounts:logout') }}">{{ csrf_input }}<button type="submit">Log out</button></form></div>
</header>
<div class="crumbs">{% block crumbs %}<a href="/admin/">Home</a>{% endblock %}</div>
<main>
  {% for m in messages %}<div class="msg msg-{{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
