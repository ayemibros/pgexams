{% extends "layout/staff_shell.html" %}
{% block page_title %}{% if bank %}Edit Bank{% else %}New Question Bank{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;padding:1.5rem">
  <form method="post">
    {{ csrf_input }}
    <div class="form-row">
      <label class="form-label">Bank name</label>
      <input type="text" name="name" class="form-input" value="{{ bank.name|default('') }}" required>
    </div>
    <div class="form-row">
      <label class="form-label">Subject</label>
      <select name="subject" class="form-select">
        <option value="">— None —</option>
        {% for s in subjects %}<option value="{{ s.pk }}" {% if bank.subject_id == s.pk %}selected{% endif %}>{{ s.icon }} {{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-textarea">{{ bank.description|default('') }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Bank</button>
    <a href="{{ url('examhub:bank_list') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
