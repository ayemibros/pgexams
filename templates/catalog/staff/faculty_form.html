{% extends "layout/staff_shell.html" %}
{% block page_title %}{% if faculty %}Edit Faculty{% else %}New Faculty{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;padding:1.5rem">
  <form method="post">
    {{ csrf_input }}
    <div class="form-row">
      <label class="form-label">Faculty name</label>
      <input type="text" name="name" class="form-input" value="{{ faculty.name|default('') }}" required placeholder="e.g. Faculty of Science">
    </div>
    <div class="form-row">
      <label class="form-label">Icon (emoji)</label>
      <input type="text" name="icon" class="form-input" value="{{ faculty.icon|default('🎓') }}" maxlength="10">
    </div>
    <div class="form-row">
      <label class="form-label">Display order</label>
      <input type="number" name="order" class="form-input" value="{{ faculty.order|default(0) }}">
      <div class="form-hint">Lower numbers appear first on the postgraduate Subscribe page.</div>
    </div>
    <div class="form-row">
      <label class="form-check">
        <input type="checkbox" name="is_active" {% if not faculty or faculty.is_active %}checked{% endif %}>
        Active
      </label>
    </div>
    <button type="submit" class="btn btn-primary">Save Faculty</button>
    <a href="{{ url('catalog:faculty_list') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
