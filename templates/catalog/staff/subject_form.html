{% extends "layout/staff_shell.html" %}
{% block page_title %}{% if subject %}Edit Subject{% else %}New Subject{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;padding:1.5rem">
  <form method="post">
    {{ csrf_input }}
    <div class="form-row">
      <label class="form-label">Subject name</label>
      <input type="text" name="name" class="form-input" value="{{ subject.name|default('') }}" required>
    </div>
    <div class="form-row">
      <label class="form-label">Icon (emoji)</label>
      <input type="text" name="icon" class="form-input" value="{{ subject.icon|default('📚') }}" maxlength="10">
    </div>
    <div class="form-row">
      <label class="form-check">
        <input type="checkbox" name="is_active" {% if not subject or subject.is_active %}checked{% endif %}>
        Active
      </label>
    </div>
    <button type="submit" class="btn btn-primary">Save Subject</button>
    <a href="{{ url('catalog:subject_list') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
